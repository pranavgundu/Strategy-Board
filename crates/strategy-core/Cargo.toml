[package]
name = "strategy-core"
version = "2026.6.0"
description = "Shared Rust core (WASM) for Strategy Board - packet codec and fuzzy search"
authors = ["Pranav Gundu <pranav@strategyboard.app>"]
license = "MIT"
repository = "https://github.com/pranavgundu/Strategy-Board"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
